<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrar usuarios - Generador Pangoa</title>
  <meta name="color-scheme" content="light dark">
  <script src="{{ url_for('static', filename='theme-init.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body data-min-password="{{ min_password }}">
  <header class="nav container">
    <div class="brand-block">
      <span class="brand">Generador de sobres</span>
      <span class="brand-sub">Municipalidad Distrital de Pangoa</span>
    </div>
    <div class="nav-actions">
      <a href="/" class="secondary">← Volver al generador</a>
      <button id="logoutBtn" class="secondary" type="button">Cerrar sesión</button>
    </div>
  </header>

  <section class="page-head container">
    <span class="eyebrow">Administración</span>
    <h1 class="heading-lg">Gestiona los <em>usuarios</em></h1>
    <p class="lead">Crea cuentas, restablece contraseñas y elimina accesos. Solo los administradores ven esta página.</p>
  </section>

  <main class="admin-main container">
    <section class="card">
      <h2>Crear nuevo usuario</h2>
      <div id="createError" class="error-box" role="alert" hidden></div>
      <div class="form-row">
        <label>Usuario
          <input type="text" id="newUsername" placeholder="Ej.: maria.lopez" autocomplete="off" maxlength="40" spellcheck="false">
          <span id="usernameHint" class="field-hint">3 a 40 caracteres: letras, números, punto, guion o guion bajo.</span>
        </label>
        <label>Contraseña
          <span class="password-wrap">
            <input type="password" id="newPassword" placeholder="Una frase larga, con espacios" autocomplete="new-password" maxlength="128">
            <button type="button" class="toggle-pass" data-target="newPassword" aria-label="Mostrar u ocultar la contraseña">Mostrar</button>
          </span>
          <ul id="pwChecklist" class="pw-checklist" aria-live="polite"></ul>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="newIsAdmin">
          <span>Es administrador</span>
        </label>
        <button id="createUserBtn" class="primary" type="button">Crear usuario</button>
      </div>
    </section>

    <section class="card">
      <h2>Usuarios existentes</h2>
      <div id="usersTableWrap">
        <p class="muted">Cargando usuarios...</p>
      </div>
    </section>
  </main>

  <div id="confirmDeleteModal" class="modal-overlay" hidden>
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="confirmDeleteMessage">
      <p id="confirmDeleteMessage"></p>
      <div class="modal-actions">
        <button type="button" id="confirmDeleteCancel" class="secondary">Cancelar</button>
        <button type="button" id="confirmDeleteOk" class="danger">Eliminar usuario</button>
      </div>
    </div>
  </div>

  <div id="resetModal" class="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
      <p id="resetTitle"></p>
      <label class="modal-field">Nueva contraseña
        <span class="password-wrap">
          <input type="password" id="resetPassword" autocomplete="new-password" maxlength="128">
          <button type="button" class="toggle-pass" data-target="resetPassword" aria-label="Mostrar u ocultar la contraseña">Mostrar</button>
        </span>
        <ul id="resetChecklist" class="pw-checklist" aria-live="polite"></ul>
      </label>
      <div id="resetError" class="error-box" role="alert" hidden></div>
      <div class="modal-actions">
        <button type="button" id="resetCancel" class="secondary">Cancelar</button>
        <button type="button" id="resetOk" class="primary">Guardar contraseña</button>
      </div>
    </div>
  </div>

  <script type="module" src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
